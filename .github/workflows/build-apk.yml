name: Build VEXY AI APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Check Android project
    run: |
      if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
        echo "ERROR: Android project files are missing from repository root."
        exit 1
      fi
      if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
        echo "ERROR: app/build.gradle(.kts) is missing."
        exit 1
      fi

  - name: Build debug APK
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: VEXY-AI-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
